<svg width="854" height="200" viewBox="0 0 854 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pixel-violet-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#240747" />
      <stop offset="25%" stop-color="#5a189a" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="75%" stop-color="#5a189a" />
      <stop offset="100%" stop-color="#240747" />
    </linearGradient>

    <linearGradient id="pixel-violet-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c096c" />
      <stop offset="50%" stop-color="#c77dff" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>

    
    <g id="pixel-sparkle">
      <rect x="4" y="0" width="4" height="12" fill="#e0aaff" />
      <rect x="0" y="4" width="12" height="4" fill="#e0aaff" />
      <rect x="4" y="4" width="4" height="4" fill="#ffffff" />
    </g>
  </defs>

  <style>
    .sparkle-1 { animation: blink 3.2s steps(2, end) infinite; }
    .sparkle-2 { animation: blink 4.5s steps(2, end) infinite 1.1s; }
    .sparkle-3 { animation: blink 2.8s steps(2, end) infinite 0.5s; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
  </style>

  
